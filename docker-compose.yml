services:
  # Il nostro Load Balancer
  nginx-master:
    build: ./nginx-keepalived
    environment:
      - HA_ROLE=master
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      dok_network:
        ipv4_address: 172.20.0.10
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
    restart: on-failure
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy

  nginx-backup:
    build: ./nginx-keepalived
    environment:
      - HA_ROLE=backup
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      dok_network:
        ipv4_address: 172.20.0.11
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
    restart: on-failure
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy

  entrypoint:
    image: haproxy:alpine
    user: root
    ports:
      - "3000:3000"
    command: > #eliminiamo i warning di sicurezza da bravi bimbi
      sh -c "echo -e 'global\n  user root\ndefaults\n  timeout client 30s\n  timeout connect 5s\n  timeout server 30s\nlisten front\n  bind *:3000\n  mode tcp\n  server vip 172.20.0.100:3000' > /usr/local/etc/haproxy/haproxy.cfg && haproxy -f /usr/local/etc/haproxy/haproxy.cfg"
    networks:
      - dok_network
    depends_on:
      - nginx-master

  # Il Primo "Server"
  backend1:
    build: ./server
    environment:
      - PORT=${PORT:-3000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/dok}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
#    volumes: # utile per lo sviluppo
#      - ./server:/app
#      - /app/node_modules
    restart: on-failure
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s # Da tempo a Node di avviarsi
    networks:
      - dok_network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Il Secondo "Server"
  backend2:
    build: ./server
    environment:
      - PORT=${PORT:-3000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/dok}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
#    volumes: # Utile per lo sviluppo
#      - ./server:/app
#      - /app/node_modules
    restart: on-failure
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dok_network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: on-failure
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dok_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: on-failure
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dok_network

networks:
  dok_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16